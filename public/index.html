<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
    header { padding: 15px; background: #1f1f1f; text-align: center; font-weight: bold; border-bottom: 1px solid #333; }
    #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; font-size: 15px; word-break: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: #2a2a2a; color: #e5e5e5; border: 1px solid #3a3a3a; }
    #input-container { display: flex; padding: 10px; background: #1f1f1f; border-top: 1px solid #333; }
    #msg-input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
    #send-btn { margin-left: 8px; padding: 12px 18px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: bold; }
    #send-btn:disabled { background: #555; }
  </style>
</head>
<body>
  <header>AI Assistant</header>
  <div id="chat-box"></div>
  <div id="input-container">
    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const USER_ID = "d94ea217-9a75-4542-b1e1-ee8e74fb5a84";
    let conversationId = null;

    async function sendMessage() {
      const input = document.getElementById("msg-input");
      const sendBtn = document.getElementById("send-btn");
      const message = input.value.trim();
      if (!message) return;

      appendMessage("user", message);
      input.value = "";
      sendBtn.disabled = true;

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: USER_ID, conversationId, message })
        });
        const data = await response.json();
        if (data.reply) {
          conversationId = data.conversationId;
          appendMessage("assistant", data.reply);
        } else {
          appendMessage("assistant", "Error: " + (data.error || "No response received."));
        }
      } catch (err) {
        appendMessage("assistant", "Network error. Try again.");
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("msg-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
